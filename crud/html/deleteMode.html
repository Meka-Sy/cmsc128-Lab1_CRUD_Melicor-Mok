<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delete Mode</title>
    <link rel="stylesheet" href="/css/deleteMode.css">
</head>
<body>
    <div class="deleteModeContainer">
        <!-- To do list section with the side tabs -->
        <div class="notebookCard">
            <header class="deleteModeHeader">
                <div class="headerText">
                    <h1 id="modeTitleDelete">Delete Mode</h1>
                    <p>Tap the <span class="highlight">minus sign</span> next to the task you want to remove, then confirm the deletion when asked.</p>
                </div>
                <button class="backBtn"><i class="fa-solid fa-reply">Exit Delete Mode</i></button>
            </header>

            <main class="listSheet">
                <ul id="taskList" class="taskList">
                    <!-- Rendered dynamically by JS -->
                </ul>
            </main>

            <aside class="sideTabs">
                <button class="tabPriority"><span class="iconPriority"></span>Priority</button>
                <button class="tabDateCreated"><span class="iconDateCreated"></span>Date Created</button>
                <button class="tabTag"><span class="iconTag"></span>Tag</button>
            </aside>
        </div>
        
    </div>
    <!-- Confirm delete popup -->
    <div class="popupOverlay" id="confirmOverlay">
        <div class="popupCard" role="alertdialog" aria-modal="true" aria-labelledby="confirmText">
            <div class="popupIcon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 6h18"></path>
                    <path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                    <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"></path>
                    <line x1="10" y1="11" x2="10" y2="17"></line>
                    <line x1="14" y1="11" x2="14" y2="17"></line>
                </svg>
            </div>
            <p id="confirmText">1 task selected.<br>Are you sure you want to delete this task?</p>
            <button class="popupAction" id="confirmDeleteBtn">Delete</button>
        </div>
    </div>
    <!-- Undo toast/snackbar -->
    <div class="toast" id="undoToast" role="status" aria-live="polite"> 
        <span class="toastMessage" id="toastMessage">Task deleted.</span>
        <button class="toastUndoBtn" id="toastUndoBtn">Undo</button>
        <div class="toastProgress" id="toastProgress"></div>
     </div>
 
    <script src="/js/deleteMode.js" defer></script>
</body>
</html>
