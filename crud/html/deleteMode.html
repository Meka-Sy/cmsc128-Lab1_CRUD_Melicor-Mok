<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delete Mode</title>
    <link rel="stylesheet" href="../css/deleteMode.css">
</head>
<body>
    <div class="deleteModeContainer">
        <!-- To do list section with the side tabs -->
        <div class="notebookCard">
            <header class="deleteModeHeader">
                <div class="headerText">
                    <h1 id="modeTitle">Delete Mode</h1>
                    <p>Tap the <span class="highlight">minus sign</span> to select the task to delete.</p>
                </div>
                <button class="backBtn"><i class="fa-solid fa-reply">Exit Delete Mode</i></button>
            </header>

            <main class="listSheet">
                <ul id="taskList" class="taskList">
                    <!-- Rendered dynamically by JS -->
                </ul>
            </main>

            <aside class="sideTabs">
                <button class="tabPriority"><span class="iconPriority"></span>Priority</button>
                <button class="tabDateCreated"><span class="iconDateCreated"></span>Date Created</button>
                <button class="tabTag"><span class="iconTag"></span>Tag</button>
            </aside>
        </div>

        <!-- Home Navigation Buttons -->
        <div class="buttonContainerHome">
            <button type="button" id="deleteModeDelete">Delete Mode</button>
            <button type="button" id="editTaskDelete">Edit Task</button>
            <button type="button" id="addTaskDelete">Add Task</button>
        </div>
    </div>

</body>
</html>
