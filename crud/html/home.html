<!DOCTYPE html>
<html>
    <head>
        <title>Home</title>
        <link rel="stylesheet" href="../css/home.css">
    </head>
    <body>
        <h1 class="titleHome">To-Do List</h1>
        <div id="homePage">
            <div class="topRow">
                <div id="taskContainer">
                    <ul id="taskList"></ul>
                    <p id="emptyState" hidden>No tasks yet — add one to get started.</p>
                </div>
                <div class="sideTabs">
                    <button class="tabPriority"><span class="iconPriority"></span>Priority</button>
                    <button class="tabDateCreated"><span class="iconDateCreated"></span>Date Created</button>
                    <button class="tabTag"><span class="iconTag"></span>Tag</button>
                </div>
            </div>
            <div class="buttonContainerHome">
                <button type="button" id="deleteMode">Delete Mode</button>
                <button type="button" id="editTask">Edit Task</button>
                <button type="button" id="addTask">Add Task</button>
            </div>
        </div>
    </body>
</html>
