<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Home</title>
        <link rel="stylesheet" href="/css/home.css">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    </head>
    <body>
        <h1 class="titleHome">To-Do List</h1>
        <div class="notebookCard">

            <div id="homePage">
                <div class="topRow">
                    <div id="taskContainer">
                        <ul id="taskList"></ul>
                        <p id="emptyState">No tasks yet — add one to get started.</p>
                    </div>
                    <div class="sideTabs">
                        <button class="tabFilterSort" id="filterSortTab">
                            <span class="iconFilterSort">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <line x1="4" y1="6" x2="20" y2="6"></line>
                                    <circle cx="9" cy="6" r="2" fill="currentColor" stroke="none"></circle>
                                    <line x1="4" y1="12" x2="20" y2="12"></line>
                                    <circle cx="15" cy="12" r="2" fill="currentColor" stroke="none"></circle>
                                    <line x1="4" y1="18" x2="20" y2="18"></line>
                                    <circle cx="11" cy="18" r="2" fill="currentColor" stroke="none"></circle>
                                </svg>
                            </span>
                            Filter and Sort
                        </button>
                        <div class="tabPriority sortTab" id="sortPriority" data-field="priority" tabindex="0" role="group" aria-label="Sort by priority">
                            <span class="iconPriority"></span>
                            <span class="tabLabel">Priority</span>
                            <div class="sortOptionRow">
                                <span class="sortOptionLabel">High to Low</span>
                                <button type="button" class="sortArrowBtn" data-field="priority" data-dir="desc" data-icon="arrow-up-circle" title="High first" aria-label="Sort priority, high first">
                                    <i class="bi bi-arrow-up-circle"></i>
                                </button>
                            </div>
                            <div class="sortOptionRow">
                                <span class="sortOptionLabel">Low to High</span>
                                <button type="button" class="sortArrowBtn" data-field="priority" data-dir="asc" data-icon="arrow-down-circle" title="Low first" aria-label="Sort priority, low first">
                                    <i class="bi bi-arrow-down-circle"></i>
                                </button>
                            </div>
                        </div>
                        <div class="tabDateCreated sortTab" id="sortDateCreated" data-field="date_created" tabindex="0" role="group" aria-label="Sort by date created">
                            <span class="iconDateCreated"></span>
                            <span class="tabLabel">Date Created</span>
                            <div class="sortOptionRow">
                                <span class="sortOptionLabel">Newest First</span>
                                <button type="button" class="sortArrowBtn" data-field="date_created" data-dir="desc" data-icon="arrow-up-circle" title="Newest" aria-label="Sort date created, newest first">
                                    <i class="bi bi-arrow-up-circle"></i>
                                </button>
                            </div>
                            <div class="sortOptionRow">
                                <span class="sortOptionLabel">Oldest First</span>
                                <button type="button" class="sortArrowBtn" data-field="date_created" data-dir="asc" data-icon="arrow-down-circle" title="Oldest" aria-label="Sort date created, oldest first">
                                    <i class="bi bi-arrow-down-circle"></i>
                                </button>
                            </div>
                        </div>
                        <div class="tabTag sortTab" id="sortTag" data-field="tag" tabindex="0" role="group" aria-label="Sort by tag">
                            <span class="iconTag"></span>
                            <span class="tabLabel">Tag</span>
                            <div class="sortOptionRow">
                                <span class="sortOptionLabel">A to Z</span>
                                <button type="button" class="sortArrowBtn" data-field="tag" data-dir="asc" data-icon="arrow-down-circle" title="A-Z" aria-label="Sort tag, A to Z">
                                    <i class="bi bi-arrow-down-circle"></i>
                                </button>
                            </div>
                            <div class="sortOptionRow">
                                <span class="sortOptionLabel">Z to A</span>
                                <button type="button" class="sortArrowBtn" data-field="tag" data-dir="desc" data-icon="arrow-up-circle" title="Z-A" aria-label="Sort tag, Z to A">
                                    <i class="bi bi-arrow-up-circle"></i>
                                </button>
                            </div>
                        </div>
                        <div class="tabDueDate sortTab" id="sortDueDate" data-field="due_date" tabindex="0" role="group" aria-label="Sort by due date">
                            <span class="iconDueDate">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <rect x="3" y="4" width="18" height="18" rx="2"></rect>
                                    <line x1="16" y1="2" x2="16" y2="6"></line>
                                    <line x1="8" y1="2" x2="8" y2="6"></line>
                                    <line x1="3" y1="10" x2="21" y2="10"></line>
                                </svg>
                            </span>
                            <span class="tabLabel">Due Date</span>
                            <div class="sortOptionRow">
                                <span class="sortOptionLabel">Latest First</span>
                                <button type="button" class="sortArrowBtn" data-field="due_date" data-dir="desc" data-icon="arrow-up-circle" title="Latest" aria-label="Sort due date, latest first">
                                    <i class="bi bi-arrow-up-circle"></i>
                                </button>
                            </div>
                            <div class="sortOptionRow">
                                <span class="sortOptionLabel">Earliest First</span>
                                <button type="button" class="sortArrowBtn" data-field="due_date" data-dir="asc" data-icon="arrow-down-circle" title="Earliest" aria-label="Sort due date, earliest first">
                                    <i class="bi bi-arrow-down-circle"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="buttonContainerHome">
                    <button type="button" id="deleteMode">Delete Mode</button>
                    <button type="button" id="editTask">Edit Task</button>
                    <button type="button" id="addTask">Add Task</button>
                </div>
            </div>

            <!-- Task Popup Overlay -->
            <div id="taskPopup" class="popup-overlay" hidden>
                <div class="popup-card">
                    <button type="button" id="closePopup" class="close-btn">&times;</button>
                    <i class="bi bi-plus-circle popup-icon"></i>
                    <form id="taskForm">
                        <div class="form-group">
                            <label for="taskName">Task Name:</label>
                            <input type="text" id="taskName" name="text" required>
                        </div>
                        <div class="form-group">
                            <label for="taskPriorityLevel">Priority Level:</label>
                            <select id="taskPriorityLevel" name="priority">
                                <option value="Low">Low</option>
                                <option value="Medium" selected>Medium</option>
                                <option value="High">High</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="taskTag">Tag:</label>
                            <select id="taskTag" name="tag">
                                <option value="Personal">Personal</option>
                                <option value="Work">Work</option>
                                <option value="Finance">Finance</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="taskDueDate">Due Date:</label>
                            <input type="date" id="taskDueDate" name="due_date">
                        </div>
                        <button type="submit" class="submit-btn">Add</button>
                    </form>
                </div>
            </div>

            <!-- Success Popup -->
            <div class="popupOverlay" id="successOverlay">
                <div class="popupCard" role="alertdialog" aria-modal="true" aria-labelledby="successText">
                    <div class="popupIcon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="10"></circle>
                            <path d="M8 12l3 3 5-6"></path>
                        </svg>
                    </div>
                    <p id="successText">Task created successfully!</p>
                    <button class="popupAction" id="successOkBtn">OK</button>
                </div>
            </div>

        </div>

        <script src="/js/home.js"></script>
    </body>
</html>
