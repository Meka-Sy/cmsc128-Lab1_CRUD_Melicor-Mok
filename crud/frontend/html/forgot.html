<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Advent+Pro:wght@400;500;600;700&family=Outfit:wght@300;400;500;600&display=swap">
  <link rel="stylesheet" href="/css/form.css">
  <link rel="stylesheet" href="/css/authFonts.css">
  <link rel="stylesheet" href="/css/flashMessage.css">
  <title>Forgot password</title>
</head>
<body>
  <form class="card card--blue" method="post">
    <span class="card-icon" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
        <rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>
      </svg>
    </span>
    <h2>Forgot password</h2>
    <p class="hint">Enter your email and we'll send you a link to reset your password.</p>

    {% for category, msg in get_flashed_messages(with_categories=true) %}
      <p class="flash {{ category }}" role="alert">{{ msg }}</p>
    {% endfor %}

    <label for="email">Email:</label>
    <input type="email" id="email" name="email" required autofocus autocomplete="email">

    <button type="submit">Send reset link</button>
    <p class="alt"><a href="{{ url_for('auth.login') }}">Back to log in</a></p>
  </form>
</body>
</html>
