<!DOCTYPE html>
<html>
  <head>
      <meta charset="utf-8">
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <link rel="stylesheet" href="/css/form.css">
  </head>
  <body>
    <h1>Profile</h1>
    {% for category, msg in get_flashed_messages(with_categories=true) %}
    <p class="flash {{ category }}">{{ msg }}</p>
    {% endfor %}
    <form method="post">
      <input type="hidden" name="action" value="email">
      <label>Email
        <input type="email" name="email" value="{{ current_user.email }}" required>
      </label>
      <button type="submit">Update email</button>
    </form>
    <form method="post">
    <input type="hidden" name="action" value="display_name">
    <label>Display name
      <input type="text" name="display_name" value="{{ current_user.display_name }}" required>
    </label>
    <button type="submit">Update name</button>
  </form>

  <form method="post">
    <input type="hidden" name="action" value="password">
    <label>Current password <input type="password" name="current_password" required></label>
    <label>New password <input type="password" name="new_password" minlength="8" required></label>
    <label>Confirm new password <input type="password" name="confirm_password" required></label>
    <button type="submit">Change password</button>
  </form>

  <a href="{{ url_for('home') }}">Back to tasks</a>
  </body>
</html>
