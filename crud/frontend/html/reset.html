<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/css/form.css">
  <title>Reset password</title>
</head>
<body>
  {% if valid %}
  <form method="post">
    <h2>Choose a new password</h2>
    {% if error %}<p class="field-error">{{ error }}</p>{% endif %}
    <input type="password" name="password" placeholder="New password" minlength="8" required autofocus autocomplete="new-password">
    <input type="password" name="confirm_password" placeholder="Confirm new password" required autocomplete="new-password">
    <button type="submit">Reset password</button>
  </form>
  {% else %}
  <div>
    <h2>Link invalid or expired</h2>
    <p>This reset link has expired or was already used.</p>
    <p><a href="{{ url_for('recovery.forgot') }}">Request a new one</a></p>
  </div>
  {% endif %}
</body>
</html>
